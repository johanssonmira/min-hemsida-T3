<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12324a">
  <title>SYSB23 Plugg</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="ikoner/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SYSB23">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-rad">
    <button id="btn-hem" class="logo">SYSB23 <span>Plugg</span></button>

    <nav class="navrad" id="mainnav">
      <button class="navbtn active" data-vy="hem">Hem</button>
      <button class="navbtn" data-vy="las">Läs</button>
      <button class="navbtn navbtn-sql" data-vy="sql">SQL</button>
      <button class="navbtn" data-vy="ova">Öva</button>
      <button class="navbtn" data-vy="prov">Prov</button>
      <button class="navbtn" data-vy="essa">Essä</button>
      <button class="navbtn" data-vy="statistik">Statistik</button>
      <button class="navbtn" data-vy="schema">Schema</button>
    </nav>

    <button id="btn-tema" class="temaknapp" aria-label="Byt färgtema" title="Byt färgtema">
      <span class="tema-prickar" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="tema-text">Tema</span>
    </button>

    <div class="delkursvaljare">
      <span class="dv-etikett" aria-hidden="true">Delkurs</span>
      <span class="dv-kontroll">
        <i class="dv-prick" aria-hidden="true"></i>
        <select id="sel-delkurs" class="delkursval" aria-label="Välj vilken delkurs du pluggar"></select>
      </span>
    </div>
  </div>

  <!-- Kontextband: visar hela tiden vilken delkurs som är vald och hur den går -->
  <div class="delkursband"><div class="wrap dkb-rad" id="delkursband"></div></div>
</header>

<main class="wrap">
  <section id="vy-hem"       class="vy"></section>
  <section id="vy-las"       class="vy dold"></section>
  <section id="vy-sql"       class="vy dold"></section>
  <section id="vy-ova"       class="vy dold"></section>
  <section id="vy-prov"      class="vy dold"></section>
  <section id="vy-essa"      class="vy dold"></section>
  <section id="vy-statistik" class="vy dold"></section>
  <section id="vy-schema"    class="vy dold"></section>
</main>

<!-- Dialogruta för egna händelser och ändrade pass. Byggs av js/passform.js -->
<div id="overlagg" class="overlagg dold" role="dialog" aria-modal="true" aria-labelledby="overlagg-rubrik"></div>

<footer class="wrap">
  <p class="muted liten">
    Innehållet bygger på kursmaterialet i <code>sysb23-kursmaterial/</code> och gamla tentor.
    Kalendern är avläst mot TimeEdit 1 augusti 2026 – kontrollera alltid aktuell vecka själv.
    All statistik sparas lokalt i din webbläsare.
  </p>
</footer>

<!-- Data -->
<script src="data/topics.js"></script>
<script src="data/kalender.js"></script>
<script src="data/ordlista.js"></script>
<script src="data/kompendium-strategi-1.js"></script>
<script src="data/kompendium-strategi-2.js"></script>
<script src="data/kompendium-strategi-3.js"></script>
<script src="data/kompendium-databaser-1.js"></script>
<script src="data/kompendium-databaser-2.js"></script>
<script src="data/sql-databas.js"></script>
<script src="data/sql-ovningar.js"></script>
<script src="data/questions-db-sql.js"></script>
<script src="data/questions-db-joins.js"></script>
<script src="data/questions-db-design.js"></script>
<script src="data/questions-db-app.js"></script>
<script src="data/questions-strategi-ekonomistyrning.js"></script>
<script src="data/questions-strategi-styrning.js"></script>
<script src="data/questions-strategi-forelasning1.js"></script>

<!-- Applikation -->
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/tema.js"></script>
<script src="js/hem.js"></script>
<script src="js/las.js"></script>
<script src="js/ova.js"></script>
<script src="js/essa.js"></script>
<script src="js/statistik.js"></script>
<script src="js/passform.js"></script>
<script src="js/sqlverkstad.js"></script>
<script src="js/schema.js"></script>
<script src="js/app.js"></script>

</body>
</html>
